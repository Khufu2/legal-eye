name: Apply CELLAR canonical negotiation
on:
  push:
    paths:
      - scripts/patch_cellar_http_negotiation.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_cellar_http_negotiation.py
      - run: python -m py_compile services/docling/worker.py
      - run: |
          rm scripts/patch_cellar_http_negotiation.py .github/workflows/apply-cellar-http-negotiation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add services/docling/worker.py scripts/patch_cellar_http_negotiation.py .github/workflows/apply-cellar-http-negotiation.yml
          git commit -m "Fix CELLAR canonical content negotiation"
          git push
