name: Apply global research lifecycle
on:
  push:
    paths:
      - scripts/patch_research_global_lifecycle.py
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python scripts/patch_research_global_lifecycle.py
      - run: |
          rm scripts/patch_research_global_lifecycle.py .github/workflows/apply-research-global-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/page.tsx app/api/legal-work/route.ts scripts/patch_research_global_lifecycle.py .github/workflows/apply-research-global-lifecycle.yml
          git commit -m "Expand research across approved global corpus"
          git push
