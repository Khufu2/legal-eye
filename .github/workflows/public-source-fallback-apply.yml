name: Apply official source fallback

on:
  push:
    paths:
      - '.github/workflows/public-source-fallback-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: npm
      - name: Install serverless PDF extraction
        run: npm install --save-exact unpdf@1.8.1
      - name: Apply official-source fallback
        run: python scripts/apply_public_source_fallback.py
      - name: Typecheck fallback
        id: typecheck
        shell: bash
        run: |
          set -o pipefail
          npm run typecheck 2>&1 | tee typecheck-output.txt
      - name: Upload typecheck diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: official-source-typecheck
          path: typecheck-output.txt
          retention-days: 1
      - name: Test application
        if: success()
        run: npm test
      - name: Validate diff
        if: success()
        run: git diff --check
      - name: Commit changes
        if: success()
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name legal-eye-automation
          git config user.email actions@users.noreply.github.com
          git add package.json package-lock.json app/api/legal-ai/route.ts app/api/legal-ai/public-source-fallback.ts
          git commit -m "Add on-demand exact official source fallback"
          git push
