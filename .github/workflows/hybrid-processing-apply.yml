name: Apply hybrid processor

on:
  push:
    paths:
      - '.github/workflows/hybrid-processing-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patch script
        run: python scripts/apply_hybrid_processing_patch.py
      - name: Validate Python
        run: python -m py_compile services/docling/fallback.py services/docling/pipeline.py services/docling/worker.py
      - name: Validate diff
        run: git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name legal-eye-automation
          git config user.email actions@users.noreply.github.com
          git add services/docling/worker.py services/docling/pipeline.py services/docling/pyproject.toml services/docling/Dockerfile
          git commit -m "Make document processing resilient with Supabase fallback"
          git push
