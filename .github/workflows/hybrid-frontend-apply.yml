name: Apply hybrid upload flow

on:
  push:
    paths:
      - '.github/workflows/hybrid-frontend-apply.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply hybrid upload patch
        run: python scripts/apply_hybrid_frontend_patch.py
      - name: Validate Python worker
        run: python -m py_compile services/docling/fallback.py services/docling/pipeline.py services/docling/worker.py
      - name: Validate diff
        run: git diff --check
      - name: Commit changes
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name legal-eye-automation
          git config user.email actions@users.noreply.github.com
          git add app/page.tsx services/docling/worker.py .github/workflows
          git commit -m "Route uploads through Supabase hybrid processing"
          git push
