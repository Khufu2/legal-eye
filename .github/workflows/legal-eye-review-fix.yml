name: Apply Legal Eye Review Fix
on:
  push:
    branches: [main]
    paths:
      - .github/workflows/legal-eye-review-fix.yml
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Patch review workspace
        run: python scripts/patch_review_workspace.py
      - name: Commit review fix
        run: |
          git config user.name "legal-eye-automation"
          git config user.email "actions@users.noreply.github.com"
          rm .github/workflows/legal-eye-review-fix.yml scripts/patch_review_workspace.py
          git add app/page.tsx .github/workflows/legal-eye-review-fix.yml scripts/patch_review_workspace.py
          git commit -m "Persist contract reviews and export findings"
          git push origin main
