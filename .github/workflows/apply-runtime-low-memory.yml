name: Apply low-memory runtime patch

on:
  push:
    branches: [main]
    paths:
      - scripts/patch_runtime_low_memory.py
      - .github/workflows/apply-runtime-low-memory.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply runtime patch
        run: python scripts/patch_runtime_low_memory.py
      - name: Normalize generated parser source
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/docling/app.py')
          text = path.read_text()
          text = text.replace('payload["derived_markdown"] = "\n\n".join', 'payload["derived_markdown"] = "\\n\\n".join')
          path.write_text(text)
          PY
      - name: Validate Python
        run: python -m py_compile services/docling/worker.py services/docling/fallback.py services/docling/app.py services/scanner/app.py
      - name: Commit runtime patch
        run: |
          rm -f scripts/patch_runtime_low_memory.py .github/workflows/apply-runtime-low-memory.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Run document processing within Railway memory limits"
          git push
